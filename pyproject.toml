[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxel-asset-maker"
version = "0.1.0"
description = "Pixel editor for voxel-game block and item textures."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "pillow>=10",
    "PySide6-Essentials>=6.6",
]

[project.scripts]
voxel-asset-maker = "voxel_asset_maker.__main__:main"

[tool.setuptools.packages.find]
include = ["voxel_asset_maker*"]
